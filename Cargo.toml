[package]
name = "laniusc"
version = "0.1.0"
edition = "2024"
default-run = "laniusc"
# One test binary per file in tests/ is 651 links of the compiler. The suites
# in tests/suites/ list the files instead.
autotests = false

[workspace]
members = [
    "crates/laniusc-compiler",
    "crates/laniusc-shaders",
    "crates/vk-hang-probe",
]
resolver = "3"

[dependencies]
laniusc-compiler = { path = "crates/laniusc-compiler" }
wgpu = { version = "29.0.3", features = ["spirv"] }

anyhow = "1.0"
encase = "0.11.1"
pollster = "0.4.0"
hashbrown = "0.15.5"
which = "8.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.8.0"
serde_json = "1.0"
log = "0.4"
rayon = "1.10.0"
rand = "0.9.2"
futures-intrusive = "0.5.0"
tokio = { version = "1.47.1", features = ["rt", "macros"] }
bnf = "0.5.0"

[build-dependencies]
laniusc-shaders = { path = "crates/laniusc-shaders" }

[features]
gpu-debug = ["laniusc-compiler/gpu-debug"]
graphics_debugger = ["laniusc-compiler/graphics_debugger"]

[profile.release]
debug = 1   # keep useful line info without bloating too much
incremental = true # an edit rebuilds laniusc in about 12 s; without it, 70 s
lto = "off" # optional: improves at-a-glance attribution across crates

[[test]]
name = "compiler"
path = "tests/suites/compiler.rs"

[[test]]
name = "stdlib"
path = "tests/suites/stdlib.rs"

[[test]]
name = "extended"
path = "tests/suites/extended.rs"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

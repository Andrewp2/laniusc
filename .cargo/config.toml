[env]
# The test helper holds one lock around each GPU compile, so compiles still
# run one at a time. The threads let the rest of a test overlap: host-only
# tests, and running the programs the compiles produce.
RUST_TEST_THREADS = { value = "16" }
# Release builds skip wgpu's indirect-dispatch argument check
# (`indirect_dispatch_validation` in gpu/device.rs). Tests keep it, so a
# kernel that writes an out-of-range dispatch is still caught.
# This is a default: a `LANIUS_CHECK` set in the shell replaces it, so add
# `indirect-dispatch` to that list to keep the check.
LANIUS_CHECK = { value = "indirect-dispatch" }
